name: "Launchdeck countries"
run-name: Deploy ${{ inputs.rollback_sha || github.sha }}
on:
  push:
    branches: ["main"]
  workflow_dispatch:
    inputs:
      rollback_sha:
        description: Existing full commit SHA to roll back to (empty builds this commit)
        required: false
        type: string
permissions:
  contents: read
  packages: write
concurrency:
  group: launchdeck-7eceb670-c7af-45ec-baf3-6a672f18eca6
  cancel-in-progress: false
jobs:
  deploy:
    if: "github.ref == 'refs/heads/main'"
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      IMAGE: "ghcr.io/mashateayoub/countries/launchdeck-7eceb670-c7af-45ec-baf3-6a672f18eca6"
      ROLLBACK_SHA: ${{ inputs.rollback_sha }}
      SSH_HOST: "ec2-13-60-169-45.eu-north-1.compute.amazonaws.com"
      SSH_USER: "ec2-user"
      SSH_PORT: "22"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        if: inputs.rollback_sha == '' && hashFiles('package-lock.json') != ''
        with:
          node-version: '24'
          cache: npm
      - name: Test application
        if: inputs.rollback_sha == '' && hashFiles('package-lock.json') != ''
        env:
          CI: 'true'
        run: |
          npm ci
          npm run lint --if-present
          npm run typecheck --if-present
          npm run test --if-present
      - name: Select immutable image
        id: image
        shell: bash
        run: |
          set -euo pipefail
          sha="${ROLLBACK_SHA:-$GITHUB_SHA}"
          [[ "$sha" =~ ^[a-f0-9]{40}$ ]] || exit 2
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-qemu-action@v3
        if: inputs.rollback_sha == ''
      - uses: docker/setup-buildx-action@v3
        if: inputs.rollback_sha == ''
      - uses: docker/login-action@v3
        if: inputs.rollback_sha == ''
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        if: inputs.rollback_sha == ''
        with:
          context: .
          file: Dockerfile
          push: true
          platforms: linux/amd64
          tags: ${{ env.IMAGE }}:${{ steps.image.outputs.sha }}
      - name: Deploy and check health
        shell: bash
        env:
          SSH_KEY: ${{ secrets.LD_7ECEB670_C7AF_45EC_BAF3_6A672F18ECA6_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.LD_7ECEB670_C7AF_45EC_BAF3_6A672F18ECA6_KNOWN_HOSTS }}
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          IMAGE_SHA: ${{ steps.image.outputs.sha }}
        run: |
          set -euo pipefail
          umask 077
          keydir=$(mktemp -d)
          trap 'rm -rf "$keydir"' EXIT
          printf '%s\n' "$SSH_KEY" > "$keydir/key"
          printf '%s\n' "$KNOWN_HOSTS" > "$keydir/known_hosts"
          opts=(-i "$keydir/key" -o BatchMode=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$keydir/known_hosts" -o ConnectTimeout=20)
          target="$SSH_USER@$SSH_HOST"
          staging="$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          [[ "$staging" =~ ^[0-9]+-[0-9]+$ ]] || exit 2
          ssh "${opts[@]}" -p "$SSH_PORT" "$target" "mkdir -p .launchdeck/7eceb670-c7af-45ec-baf3-6a672f18eca6/.incoming-$staging"
          scp "${opts[@]}" -P "$SSH_PORT" .launchdeck/7eceb670-c7af-45ec-baf3-6a672f18eca6/bootstrap.sh .launchdeck/7eceb670-c7af-45ec-baf3-6a672f18eca6/compose.yaml .launchdeck/7eceb670-c7af-45ec-baf3-6a672f18eca6/deploy.sh "$target:.launchdeck/7eceb670-c7af-45ec-baf3-6a672f18eca6/.incoming-$staging/"
          ssh "${opts[@]}" -p "$SSH_PORT" "$target" "bash .launchdeck/7eceb670-c7af-45ec-baf3-6a672f18eca6/.incoming-$staging/bootstrap.sh"
          printf '%s\n' "$REGISTRY_TOKEN" | ssh "${opts[@]}" -p "$SSH_PORT" "$target" "bash .launchdeck/7eceb670-c7af-45ec-baf3-6a672f18eca6/.incoming-$staging/deploy.sh '$GITHUB_ACTOR' '$IMAGE_SHA' '$staging'"
